<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
  <h2>Password Reset Request</h2>
  <p>You requested a password reset for <strong>{{ email }}</strong>. Click the link below to set a new password:</p>
  <p style="margin: 20px 0;">
    <a href="{{ reset_link }}" style="background-color: #007bff; color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 5px;">Reset Password</a>
  </p>
  <p>If you did not request this, please ignore this email.</p>
</body>
</html>
