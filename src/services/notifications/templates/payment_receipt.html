<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
  <h2>Payment Receipt</h2>
  <p>Thank you for your purchase, <strong>{{ email }}</strong>!</p>
  <p>Your payment has been successfully processed.</p>

  <ul style="background-color: #f8f9fa; padding: 15px 30px; list-style-type: none; border-radius: 5px;">
    <li><strong>Transaction ID:</strong> {{ payment_id }}</li>
    <li><strong>Amount Paid:</strong> {{ amount }} {{ currency }}</li>
    <li><strong>Status:</strong> Successful</li>
  </ul>

  <p>Enjoy watching your movies!</p>
</body>
</html>
